<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0EBFA"/>
      <stop offset="100%" stop-color="#B8D5F8"/>
    </linearGradient>
    <filter id="av-shadow" x="0" y="0" width="200" height="200" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14211D" flood-opacity="0.14"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#av-bg)"/>
  <circle cx="100" cy="100" r="94" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

  <!-- Bust / Shoulders -->
  <g filter="url(#av-shadow)">
    <!-- Clothing / Hoodie -->
    <path d="M40 185 C40 145 65 135 100 135 C135 135 160 145 160 185 Z" fill="#174A86"/>
    <!-- Collar line -->
    <path d="M85 135 C95 150 105 150 115 135" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none"/>

    <!-- Neck -->
    <rect x="90" y="115" width="20" height="25" rx="6" fill="#D99B6A"/>

    <!-- Head -->
    <ellipse cx="100" cy="95" rx="38" ry="44" fill="#D99B6A"/>

    <!-- Facial Features -->
    <!-- Eyes -->
    <circle cx="86" cy="95" r="4.5" fill="#14211D"/>
    <circle cx="114" cy="95" r="4.5" fill="#14211D"/>
    <circle cx="87.5" cy="93.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="115.5" cy="93.5" r="1.5" fill="#FFFFFF"/>

    <!-- Gentle Friendly Smile -->
    <path d="M90 112 C95 120 105 120 110 112" stroke="#14211D" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Custom Hair -->
    <!-- Curly Hair -->
   <circle cx="70" cy="70" r="16" fill="#2B1A09"/>
   <circle cx="90" cy="60" r="18" fill="#2B1A09"/>
   <circle cx="110" cy="60" r="18" fill="#2B1A09"/>
   <circle cx="130" cy="70" r="16" fill="#2B1A09"/>
   <circle cx="65" cy="88" r="14" fill="#2B1A09"/>
   <circle cx="135" cy="88" r="14" fill="#2B1A09"/>

    <!-- Custom Accessories (glasses, headphones, beanie, etc.) -->
    <!-- Glasses -->
   <rect x="74" y="86" width="22" height="18" rx="6" stroke="#14211D" stroke-width="3" fill="none"/>
   <rect x="104" y="86" width="22" height="18" rx="6" stroke="#14211D" stroke-width="3" fill="none"/>
   <line x1="96" y1="94" x2="104" y2="94" stroke="#14211D" stroke-width="3"/>
  </g>
</svg>