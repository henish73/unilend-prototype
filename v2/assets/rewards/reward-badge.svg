<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="badge-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="ribbon-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F5B4B"/>
      <stop offset="100%" stop-color="#0A4438"/>
    </linearGradient>
    <filter id="badge-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6F4E00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#badge-shadow)" transform="translate(150, 135)">
    <!-- Laurel Ribbon Tails behind medal -->
    <path d="M-40 70 L-60 140 L-20 120 L0 140 L-10 70 Z" fill="url(#ribbon-green)"/>
    <path d="M40 70 L60 140 L20 120 L0 140 L10 70 Z" fill="url(#ribbon-green)"/>

    <!-- Gold Medal Rim -->
    <circle cx="0" cy="0" r="90" fill="url(#badge-gold)"/>
    <!-- Scalloped rim accents -->
    <circle cx="0" cy="0" r="76" fill="#0F5B4B" stroke="#FFE082" stroke-width="4"/>

    <!-- 5-Point Star -->
    <path d="M0 -50 L14 -16 L50 -16 L21 6 L32 42 L0 20 L-32 42 L-21 6 L-50 -16 L-14 -16 Z" 
          fill="url(#badge-gold)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Laurel wreath branch -->
    <path d="M-55 20 C-65 -20 -40 -50 0 -60" stroke="#FFE082" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M55 20 C65 -20 40 -50 0 -60" stroke="#FFE082" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Central Kindness Diamond -->
    <circle cx="0" cy="3" r="10" fill="#FFFFFF"/>
    <circle cx="0" cy="3" r="6" fill="#0F5B4B"/>
  </g>
</svg>