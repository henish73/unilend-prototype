<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="heart-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#B42318"/>
    </linearGradient>
    <filter id="donate-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#B42318" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#donate-shadow)" transform="translate(150, 150)">
    <!-- Soft Teal background badge -->
    <circle cx="0" cy="0" r="105" fill="#E2F0EA"/>
    <circle cx="0" cy="0" r="95" stroke="#9CCDBD" stroke-width="3" fill="none"/>

    <!-- Glowing Heart in Center -->
    <path d="M0 35 C-60 -20 -60 -70 -25 -70 C-5 -70 0 -50 0 -45 C0 -50 5 -70 25 -70 C60 -70 60 -20 0 35 Z" 
          fill="url(#heart-red)"/>

    <!-- Helping Hands cradling the heart from below -->
    <g stroke="#0F5B4B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="#FFFFFF">
      <!-- Left Hand -->
      <path d="M-75 35 C-60 65 -20 80 0 80 M-75 35 C-70 15 -45 25 -30 45"/>
      <!-- Right Hand -->
      <path d="M75 35 C60 65 20 80 0 80 M75 35 C70 15 45 25 30 45"/>
    </g>

    <!-- Grain / Food Sprout in heart -->
    <path d="M0 -30 V-10 M-8 -25 Q0 -20 0 -10 M8 -25 Q0 -20 0 -10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Algoma Food Bank pill -->
    <g transform="translate(-65, 50)">
      <rect width="130" height="26" rx="13" fill="#0F5B4B"/>
      <text x="65" y="18" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">FOOD BANK · 25 PTS</text>
    </g>
  </g>
</svg>