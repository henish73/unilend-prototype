<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none">
  <defs>
    <linearGradient id="succ-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DAF98"/>
      <stop offset="100%" stop-color="#0F5B4B"/>
    </linearGradient>
    <filter id="succ-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F5B4B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Confetti Burst -->
  <circle cx="60" cy="70" r="6" fill="#FF9E4A"/>
  <rect x="80" y="40" width="8" height="16" rx="3" transform="rotate(25 80 40)" fill="#9CCDBD"/>
  <circle cx="300" cy="80" r="5" fill="#4B2E8A"/>
  <rect x="270" y="45" width="10" height="14" rx="3" transform="rotate(-35 270 45)" fill="#FF9E4A"/>
  <circle cx="120" cy="30" r="4" fill="#B42318"/>
  <circle cx="230" cy="35" r="5" fill="#FFE082"/>

  <!-- Giant Checkmark Orb -->
  <g filter="url(#succ-shadow)" transform="translate(180, 130)">
    <circle cx="0" cy="0" r="70" fill="url(#succ-green)"/>
    <circle cx="0" cy="0" r="60" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.4" fill="none"/>
    <path d="M-24 2 L-6 20 L28 -14" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="180" y="235" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#14211D" text-anchor="middle">Exchange Confirmed!</text>
  <text x="180" y="258" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#0F5B4B" text-anchor="middle">+25 Points Earned · Return on time</text>
</svg>