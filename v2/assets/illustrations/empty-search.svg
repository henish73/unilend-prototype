<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!-- Soft magnifying glass exploring an empty canvas -->
  <circle cx="160" cy="100" r="75" fill="#EFEEE8"/>
  <circle cx="160" cy="100" r="55" fill="#FFFFFF" stroke="#B9BEB4" stroke-width="2"/>

  <!-- Glass lens reflection -->
  <path d="M130 80 Q160 65 180 85" stroke="#9CCDBD" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Handle -->
  <line x1="200" y1="140" x2="240" y2="180" stroke="#14211D" stroke-width="14" stroke-linecap="round"/>
  <circle cx="160" cy="100" r="8" fill="#FF9E4A"/>

  <text x="160" y="195" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#14211D" text-anchor="middle">No items matched your search</text>
  <text x="160" y="215" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="#4A5852" text-anchor="middle">Try checking all categories or post a request</text>
</svg>