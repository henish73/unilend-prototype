<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="calc-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3833"/>
      <stop offset="100%" stop-color="#14211D"/>
    </linearGradient>
    <filter id="calc-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#14211D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="280" rx="125" ry="16" fill="#14211D" fill-opacity="0.1"/>

  <!-- Calculator Body -->
  <g filter="url(#calc-shadow)" transform="translate(120, 35)">
    <rect width="160" height="240" rx="20" fill="url(#calc-body)"/>
    <rect x="2" y="2" width="156" height="236" rx="18" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <!-- Dual Line LCD Display Screen -->
    <g transform="translate(16, 20)">
      <rect width="128" height="52" rx="8" fill="#D3DEC9" stroke="#7A8B71" stroke-width="2"/>
      <!-- Solar panel above display -->
      <rect x="74" y="-10" width="48" height="10" rx="2" fill="#583416"/>
      <line x1="90" y1="-10" x2="90" y2="0" stroke="#794821" stroke-width="1"/>
      <line x1="106" y1="-10" x2="106" y2="0" stroke="#794821" stroke-width="1"/>

      <!-- Matrix LCD formula text -->
      <text x="8" y="20" font-family="'Courier New', monospace" font-weight="700" font-size="11" fill="#2E3B27">sin(π/4) + √2</text>
      <text x="120" y="44" font-family="'Courier New', monospace" font-weight="800" font-size="16" fill="#162013" text-anchor="end">2.121320344</text>
    </g>

    <!-- Navigation directional D-pad -->
    <g transform="translate(80, 92)">
      <ellipse cx="0" cy="0" rx="20" ry="12" fill="#4A5852" stroke="#6B7871" stroke-width="1.5"/>
      <circle cx="-12" cy="0" r="2" fill="#FFFFFF"/>
      <circle cx="12" cy="0" r="2" fill="#FFFFFF"/>
      <circle cx="0" cy="-6" r="2" fill="#FFFFFF"/>
      <circle cx="0" cy="6" r="2" fill="#FFFFFF"/>
    </g>
    <!-- Function keys (Shift, Alpha, Mode) -->
    <rect x="20" y="85" width="22" height="14" rx="4" fill="#FF9E4A"/>
    <rect x="46" y="85" width="22" height="14" rx="4" fill="#B42318"/>
    <rect x="114" y="85" width="26" height="14" rx="4" fill="#4A5852"/>

    <!-- Keypad Matrix (5 rows x 4 cols) -->
    <g transform="translate(20, 115)" fill="#3C4843">
      <!-- Row 1 -->
      <rect x="0" y="0" width="26" height="18" rx="4"/>
      <rect x="34" y="0" width="26" height="18" rx="4"/>
      <rect x="68" y="0" width="26" height="18" rx="4"/>
      <rect x="102" y="0" width="26" height="18" rx="4"/>

      <!-- Row 2 -->
      <rect x="0" y="24" width="26" height="18" rx="4"/>
      <rect x="34" y="24" width="26" height="18" rx="4"/>
      <rect x="68" y="24" width="26" height="18" rx="4"/>
      <rect x="102" y="24" width="26" height="18" rx="4" fill="#B42318"/>

      <!-- Row 3 -->
      <rect x="0" y="48" width="26" height="18" rx="4"/>
      <rect x="34" y="48" width="26" height="18" rx="4"/>
      <rect x="68" y="48" width="26" height="18" rx="4"/>
      <rect x="102" y="48" width="26" height="18" rx="4"/>

      <!-- Row 4 -->
      <rect x="0" y="72" width="26" height="18" rx="4"/>
      <rect x="34" y="72" width="26" height="18" rx="4"/>
      <rect x="68" y="72" width="26" height="18" rx="4"/>
      <rect x="102" y="72" width="26" height="18" rx="4"/>

      <!-- Row 5 (0, ., Exp, Ans, =) -->
      <rect x="0" y="96" width="26" height="18" rx="4"/>
      <rect x="34" y="96" width="26" height="18" rx="4"/>
      <rect x="68" y="96" width="26" height="18" rx="4"/>
      <rect x="102" y="96" width="26" height="18" rx="4" fill="#0F5B4B"/>
    </g>
  </g>

  <!-- Exam Approved Seal -->
  <g transform="translate(125, 15)">
    <rect width="150" height="30" rx="15" fill="#F8E5DE"/>
    <text x="75" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#7F3213" text-anchor="middle">🔢 Algoma Exam Approved</text>
  </g>
</svg>