<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="dongle-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A5852"/>
      <stop offset="50%" stop-color="#2D3834"/>
      <stop offset="100%" stop-color="#1E2623"/>
    </linearGradient>
    <filter id="dongle-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14211D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="270" rx="140" ry="16" fill="#14211D" fill-opacity="0.08"/>

  <!-- USB-C Plug on the Left -->
  <g filter="url(#dongle-shadow)" transform="translate(70, 140)">
    <!-- USB-C Connector metal tip -->
    <rect x="0" y="12" width="26" height="16" rx="4" fill="#B9BEB4"/>
    <rect x="4" y="15" width="18" height="10" rx="2" fill="#14211D"/>
    <!-- Small aluminum connector case -->
    <rect x="24" y="8" width="40" height="24" rx="6" fill="url(#dongle-metal)"/>
  </g>

  <!-- Flexible braided tail -->
  <path d="M134 160 C180 160, 180 160, 210 160" stroke="#14211D" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- HDMI Body Hub on the Right -->
  <g filter="url(#dongle-shadow)" transform="translate(210, 105)">
    <rect width="130" height="110" rx="20" fill="url(#dongle-metal)"/>
    <rect x="2" y="2" width="126" height="106" rx="18" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- HDMI Port cut-out -->
    <path d="M125 45 H90 L85 55 V65 L90 75 H125 Z" fill="#0F1513" stroke="#B9BEB4" stroke-width="2"/>
    <rect x="94" y="52" width="28" height="16" rx="2" fill="#FF9E4A" fill-opacity="0.3"/>
    <!-- Port label -->
    <text x="60" y="55" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">4K 60Hz</text>
    <text x="60" y="72" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#9CCDBD">HDMI</text>
    <circle cx="25" cy="58" r="4" fill="#4DAF98"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(130, 25)">
    <rect width="140" height="30" rx="15" fill="#E0EBFA"/>
    <text x="70" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#174A86" text-anchor="middle">🔌 Display Adapter</text>
  </g>
</svg>