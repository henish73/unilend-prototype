<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="umb-canopy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F5B4B"/>
      <stop offset="100%" stop-color="#072A23"/>
    </linearGradient>
    <filter id="umb-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14211D" flood-opacity="0.14"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="275" rx="130" ry="16" fill="#14211D" fill-opacity="0.08"/>

  <!-- Compact Folded Umbrella Body with Sleeve -->
  <g filter="url(#umb-shadow)" transform="translate(80, 80)">
    <!-- Sleeve & Folded Canopy -->
    <rect x="60" y="30" width="180" height="60" rx="18" fill="url(#umb-canopy)"/>
    <rect x="62" y="32" width="176" height="56" rx="16" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Wrap strap with snap button -->
    <rect x="140" y="26" width="22" height="68" rx="6" fill="#FF9E4A"/>
    <circle cx="151" cy="60" r="5" fill="#FFFFFF"/>

    <!-- Metal ferrule top tip -->
    <path d="M240 50 L270 60 L240 70 Z" fill="#B9BEB4"/>

    <!-- Ergonomic Matte Handle with Auto Open Button -->
    <rect x="5" y="34" width="55" height="52" rx="12" fill="#14211D"/>
    <!-- Push button -->
    <circle cx="32" cy="60" r="7" fill="#E4E3DC"/>
    <path d="M32 56 L32 64 M28 60 L36 60" stroke="#14211D" stroke-width="2" stroke-linecap="round"/>

    <!-- Wrist cord loop -->
    <path d="M5 60 C-20 60 -25 90 0 100 C15 106 20 85 5 65" stroke="#4A5852" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Water drops accent -->
  <g fill="#9CCDBD" transform="translate(260, 50)">
    <path d="M20 0 C20 10 10 16 10 22 C10 28 15 32 20 32 C25 32 30 28 30 22 C30 16 20 10 20 0 Z"/>
    <path d="M50 20 C50 26 44 30 44 34 C44 38 47 41 50 41 C53 41 56 38 56 34 C56 30 50 26 50 20 Z" transform="scale(0.7)"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(130, 20)">
    <rect width="140" height="30" rx="15" fill="#E5E8F7"/>
    <text x="70" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#2F3A86" text-anchor="middle">☂️ Everyday Gear</text>
  </g>
</svg>