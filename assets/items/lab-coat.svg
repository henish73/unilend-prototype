<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="coat-white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFEFEA"/>
    </linearGradient>
    <filter id="coat-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14211D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="285" rx="130" ry="16" fill="#14211D" fill-opacity="0.08"/>

  <!-- Folded Clean White Lab Coat -->
  <g filter="url(#coat-shadow)" transform="translate(100, 65)">
    <!-- Coat Body -->
    <path d="M40 30 L0 80 L30 110 L45 80 V210 H155 V80 L170 110 L200 80 L160 30 H120 L100 60 L80 30 Z" 
          fill="url(#coat-white)" stroke="#B9BEB4" stroke-width="2"/>

    <!-- Lapels -->
    <path d="M80 30 L100 95 L65 75 Z" fill="#FFFFFF" stroke="#B9BEB4" stroke-width="1.5"/>
    <path d="M120 30 L100 95 L135 75 Z" fill="#FFFFFF" stroke="#B9BEB4" stroke-width="1.5"/>

    <!-- Buttons -->
    <circle cx="100" cy="115" r="4.5" fill="#FFFFFF" stroke="#B9BEB4" stroke-width="2"/>
    <circle cx="100" cy="145" r="4.5" fill="#FFFFFF" stroke="#B9BEB4" stroke-width="2"/>
    <circle cx="100" cy="175" r="4.5" fill="#FFFFFF" stroke="#B9BEB4" stroke-width="2"/>

    <!-- Breast Pocket with Algoma Chem Logo and Pens -->
    <g transform="translate(115, 100)">
      <rect width="32" height="38" rx="4" fill="#FFFFFF" stroke="#B9BEB4" stroke-width="1.5"/>
      <!-- Algoma crest green dot -->
      <circle cx="16" cy="14" r="5" fill="#0F5B4B"/>
      <!-- 2 Pens in pocket -->
      <rect x="6" y="-12" width="4" height="14" rx="2" fill="#174A86"/>
      <rect x="14" y="-16" width="4" height="18" rx="2" fill="#B42318"/>
    </g>

    <!-- Lab Safety Goggles placed on top -->
    <g transform="translate(50, 0)">
      <!-- Strap -->
      <path d="M-10 18 Q50 -5 110 18" stroke="#14211D" stroke-width="6" fill="none"/>
      <!-- Left lens frame -->
      <rect x="0" y="5" width="45" height="32" rx="12" fill="#DDF1F1" fill-opacity="0.85" stroke="#0C5356" stroke-width="3"/>
      <!-- Right lens frame -->
      <rect x="55" y="5" width="45" height="32" rx="12" fill="#DDF1F1" fill-opacity="0.85" stroke="#0C5356" stroke-width="3"/>
      <!-- Bridge -->
      <rect x="42" y="16" width="16" height="6" rx="2" fill="#0C5356"/>
      <!-- Glass reflection glint -->
      <line x1="8" y1="12" x2="22" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <line x1="63" y1="12" x2="77" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(130, 15)">
    <rect width="140" height="30" rx="15" fill="#DDF1F1"/>
    <text x="70" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0C5356" text-anchor="middle">🥼 Lab Gear · Medium</text>
  </g>
</svg>