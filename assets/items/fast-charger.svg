<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <linearGradient id="fast-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2A26"/>
      <stop offset="100%" stop-color="#0F1513"/>
    </linearGradient>
    <linearGradient id="fast-bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF8000"/>
    </linearGradient>
    <filter id="f-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="275" rx="140" ry="18" fill="#14211D" fill-opacity="0.08"/>

  <!-- Compact GaN Cube -->
  <g filter="url(#f-shadow)" transform="translate(80, 85)">
    <!-- Prongs -->
    <rect x="22" y="-18" width="8" height="24" rx="2" fill="#B9BEB4"/>
    <rect x="46" y="-18" width="8" height="24" rx="2" fill="#B9BEB4"/>
    <rect width="76" height="86" rx="18" fill="url(#fast-body)"/>
    <rect x="2" y="2" width="72" height="82" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Glowing orange USB-C connector port -->
    <rect x="24" y="66" width="28" height="8" rx="4" fill="#000000" stroke="#FF8000" stroke-width="1.5"/>
    <path d="M38 28 L30 45 H40 L36 58 L48 41 H38 Z" fill="url(#fast-bolt)" transform="translate(0, -6) scale(0.9)"/>
    <text x="38" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#9CCDBD" text-anchor="middle">30W GaN</text>
  </g>

  <!-- Heavy duty braided USB-C Cable -->
  <path d="M118 175 C118 250, 220 260, 250 210 C270 170, 200 130, 230 100 C250 80, 300 90, 300 140 C300 190, 270 230, 320 230" 
        stroke="#0F5B4B" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#f-shadow)"/>

  <!-- Metal USB-C Header -->
  <g filter="url(#f-shadow)" transform="translate(310, 190)">
    <rect x="0" y="10" width="40" height="20" rx="6" fill="#16201D" stroke="#79C7B4" stroke-width="1.5"/>
    <rect x="40" y="13" width="18" height="14" rx="3" fill="#B9BEB4"/>
    <rect x="44" y="16" width="10" height="8" rx="2" fill="#000000"/>
    <circle cx="20" cy="20" r="4" fill="#FF8000"/>
  </g>

  <g transform="translate(130, 20)">
    <rect width="140" height="30" rx="15" fill="#FCF0CC"/>
    <text x="70" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#6F4E00" text-anchor="middle">⚡ Fast USB-C 30W</text>
  </g>
</svg>