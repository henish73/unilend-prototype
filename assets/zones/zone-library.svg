<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" fill="none">
  <defs>
    <linearGradient id="lib-bg" x1="0" y1="0" x2="340" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2F0EA"/>
      <stop offset="100%" stop-color="#C5E3D7"/>
    </linearGradient>
  </defs>

  <rect width="340" height="220" rx="24" fill="url(#lib-bg)"/>
  <rect x="2" y="2" width="336" height="216" rx="22" stroke="#9CCDBD" stroke-width="2"/>

  <!-- Library Desk Illustration -->
  <g transform="translate(45, 45)">
    <!-- Desk counter -->
    <rect x="20" y="80" width="210" height="45" rx="8" fill="#0F5B4B"/>
    <rect x="30" y="72" width="190" height="12" rx="4" fill="#0A4438"/>
    
    <!-- Desk lamp -->
    <path d="M45 72 V35 Q45 20 65 20 H75" stroke="#9A4300" stroke-width="4" fill="none"/>
    <path d="M70 15 L95 25 L75 35 Z" fill="#FF9E4A"/>
    <!-- Light cone glow -->
    <path d="M85 25 L120 75 H55 Z" fill="#FFE082" fill-opacity="0.3"/>

    <!-- Book Stacks on counter -->
    <rect x="110" y="60" width="35" height="12" rx="2" fill="#B42318"/>
    <rect x="112" y="48" width="32" height="12" rx="2" fill="#174A86"/>
    <rect x="115" y="38" width="26" height="10" rx="2" fill="#4B2E8A"/>

    <!-- Computer monitor / check-in screen -->
    <rect x="165" y="42" width="40" height="28" rx="4" fill="#14211D"/>
    <rect x="168" y="45" width="34" height="22" rx="2" fill="#9CCDBD"/>
    <rect x="182" y="70" width="6" height="6" fill="#14211D"/>

    <!-- Staffed Badge -->
    <g transform="translate(40, 95)">
      <circle cx="10" cy="10" r="5" fill="#4DAF98"/>
      <text x="22" y="14" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">STAFFED DESK · UNTIL 9 PM</text>
    </g>
  </g>

  <!-- Distance Pill -->
  <g transform="translate(195, 20)">
    <rect width="125" height="28" rx="14" fill="#FFFFFF" stroke="#9CCDBD"/>
    <text x="62" y="18" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#0F5B4B" text-anchor="middle">🚶 2 min walk</text>
  </g>
</svg>