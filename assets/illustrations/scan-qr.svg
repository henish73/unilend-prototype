<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" fill="none">
  <defs>
    <linearGradient id="phone-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D3834"/>
      <stop offset="100%" stop-color="#14211D"/>
    </linearGradient>
    <filter id="scan-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#14211D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#scan-shadow)" transform="translate(110, 30)">
    <!-- Smartphone Frame -->
    <rect width="180" height="280" rx="32" fill="url(#phone-metal)"/>
    <rect x="3" y="3" width="174" height="274" rx="29" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Screen -->
    <rect x="10" y="14" width="160" height="252" rx="22" fill="#0F1513"/>

    <!-- Camera dynamic island notch -->
    <rect x="65" y="20" width="50" height="14" rx="7" fill="#000000"/>
    <circle cx="102" cy="27" r="3" fill="#0F5B4B"/>

    <!-- Scanning Reticle Frame -->
    <g transform="translate(30, 65)">
      <!-- Corner brackets -->
      <path d="M0 25 V0 H25" stroke="#4DAF98" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M120 25 V0 H95" stroke="#4DAF98" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M0 95 V120 H25" stroke="#4DAF98" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M120 95 V120 H95" stroke="#4DAF98" stroke-width="4" stroke-linecap="round" fill="none"/>

      <!-- QR Code in view -->
      <g transform="translate(25, 25)" fill="#FFFFFF">
        <!-- Finder top left -->
        <rect x="0" y="0" width="20" height="20" rx="2"/>
        <rect x="4" y="4" width="12" height="12" fill="#0F1513"/>
        <rect x="7" y="7" width="6" height="6"/>
        <!-- Finder top right -->
        <rect x="50" y="0" width="20" height="20" rx="2"/>
        <rect x="54" y="4" width="12" height="12" fill="#0F1513"/>
        <rect x="57" y="7" width="6" height="6"/>
        <!-- Finder bottom left -->
        <rect x="0" y="50" width="20" height="20" rx="2"/>
        <rect x="4" y="54" width="12" height="12" fill="#0F1513"/>
        <rect x="7" y="57" width="6" height="6"/>
        <!-- Data cells -->
        <rect x="26" y="6" width="6" height="6"/>
        <rect x="36" y="14" width="6" height="6"/>
        <rect x="26" y="24" width="18" height="6"/>
        <rect x="26" y="40" width="6" height="18"/>
        <rect x="48" y="48" width="16" height="6"/>
        <rect x="40" y="60" width="12" height="6"/>
      </g>

      <!-- Laser scan line -->
      <line x1="-5" y1="60" x2="125" y2="60" stroke="#00FFCC" stroke-width="3"/>
      <!-- Glow gradient below laser -->
      <rect x="0" y="40" width="120" height="20" fill="url(#scan-laser-glow)" fill-opacity="0.3"/>
    </g>

    <!-- Success check pill -->
    <g transform="translate(35, 215)">
      <rect width="110" height="32" rx="16" fill="#0F5B4B"/>
      <path d="M42 231 L48 237 L58 225" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(-25, -215)"/>
      <text x="45" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF">Align to scan</text>
    </g>
  </g>
</svg>