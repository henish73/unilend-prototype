<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" fill="none">
  <defs>
    <linearGradient id="g-logo-brand" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F5B4B"/>
      <stop offset="100%" stop-color="#0A4438"/>
    </linearGradient>
    <linearGradient id="g-logo-warm" x1="100" y1="20" x2="140" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E4A"/>
      <stop offset="100%" stop-color="#9A4300"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Emblem on Left -->
  <g transform="translate(10, 10)">
    <rect width="160" height="160" rx="42" fill="#16201D"/>
    <rect x="2" y="2" width="156" height="156" rx="40" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    
    <!-- U-Loop -->
    <path d="M50 50 C50 96 62 118 80 118 C98 118 110 96 110 50" 
          stroke="#79C7B4" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M62 70 C62 98 70 108 80 108 C90 108 98 98 98 70" 
          stroke="#9CCDBD" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M50 50 L40 60 M50 50 L60 60" 
          stroke="#79C7B4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 50 L120 40 M110 50 L100 40" 
          stroke="#79C7B4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="112" cy="54" r="8" fill="url(#g-logo-warm)"/>
  </g>

  <!-- Typography: UniLend -->
  <g transform="translate(200, 105)">
    <text font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" font-size="76" letter-spacing="-1.5" 
          fill="#FFFFFF">Uni<tspan fill="#79C7B4">Lend</tspan></text>
  </g>

  <!-- Algoma Tagline and Trust Lockup -->
  <g transform="translate(205, 142)">
    <rect width="18" height="18" rx="4" fill="#0F5B4B" y="-14"/>
    <path d="M4 -7 L8 -3 L14 -11" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="0" font-family="system-ui, -apple-system, sans-serif" 
          font-weight="600" font-size="16" letter-spacing="0.4" 
          fill="#9CCDBD">CAMPUS PEER LENDING · ALGOMA UNIVERSITY</text>
  </g>
</svg>